name: Create a question
description: Ask a general question, not related to an OpenMPTCProuter install
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template only for general question, not related to an OpenMPTCProuter install.
  - type: textarea
    id: question
    attributes:
      label: Question
      placeholder: "In English please"
    validations:
      required: true
