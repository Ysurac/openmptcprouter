# OpenMPTCProuter - MPTCP and 5G Modem Optimizations
# Optimized for high-throughput WAN bonding with 5G modems

# =============================================================================
# MPTCP Configuration - Enhanced for Multi-WAN Bonding
# =============================================================================
net.mptcp.enabled = 1
net.ipv4.tcp_congestion_control = bbr

# =============================================================================
# Network Buffer Optimizations - Critical for 5G High-Speed Links
# =============================================================================
# Increase max buffer sizes to 128MB for high-speed 5G links
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.core.rmem_default = 67108864
net.core.wmem_default = 67108864

# TCP buffer sizes optimized for 5G (min, default, max)
# Min: 4KB, Default: 128KB, Max: 128MB
net.ipv4.tcp_rmem = 4096 131072 134217728
net.ipv4.tcp_wmem = 4096 131072 134217728

# Increase network device backlog for high packet rates
net.core.netdev_max_backlog = 300000
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000

# =============================================================================
# TCP Performance Optimizations for WAN Bonding
# =============================================================================
# Enable TCP window scaling (critical for high-latency 5G links)
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_adv_win_scale = 1
net.ipv4.tcp_moderate_rcvbuf = 1

# Disable slow start after idle for better throughput
net.ipv4.tcp_slow_start_after_idle = 0

# TCP Fast Open for reduced latency
net.ipv4.tcp_fastopen = 3

# Enable TCP SACK and FACK for better loss recovery
net.ipv4.tcp_sack = 1
net.ipv4.tcp_dsack = 1

# MTU probing for path MTU discovery (important for 5G modems)
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_base_mss = 1024

# Optimize TCP retransmission
net.ipv4.tcp_frto = 2
net.ipv4.tcp_early_retrans = 3

# Connection reuse and timeouts
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 10
net.ipv4.tcp_max_tw_buckets = 2000000

# TCP keepalive optimizations
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_keepalive_intvl = 15

# SYN backlog for high connection rates
net.ipv4.tcp_max_syn_backlog = 16384
net.core.somaxconn = 8192

# Disable TCP metrics cache (better for dynamic multi-WAN)
net.ipv4.tcp_no_metrics_save = 1

# TCP timestamps and protection
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_rfc1337 = 1

# ECN configuration (disabled for compatibility with some ISPs)
net.ipv4.tcp_ecn = 0

# =============================================================================
# Multipath Routing Enhancements
# =============================================================================
# Layer 4 hash policy for better load balancing
net.ipv4.fib_multipath_hash_policy = 1
net.ipv4.fib_multipath_use_neigh = 1

# =============================================================================
# Connection Tracking - Critical for Multi-WAN
# =============================================================================
net.netfilter.nf_conntrack_max = 524288
net.nf_conntrack_max = 524288
net.netfilter.nf_conntrack_tcp_timeout_established = 432000
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 15
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
net.netfilter.nf_conntrack_udp_timeout = 60
net.netfilter.nf_conntrack_udp_timeout_stream = 120

# Enable connection tracking helpers for specific protocols
net.netfilter.nf_conntrack_helper = 1

# =============================================================================
# Queue Discipline - Default to FQ for BBR
# =============================================================================
net.core.default_qdisc = fq

# =============================================================================
# UDP Optimizations - Important for QUIC and VoIP over 5G
# =============================================================================
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# =============================================================================
# IP Forwarding and Routing
# =============================================================================
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Disable source route and redirects for security
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0

# RP filter - Use loose mode (2) for multi-WAN
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.rp_filter = 2

# =============================================================================
# ARP and Neighbor Cache - Optimized for Multiple Interfaces
# =============================================================================
net.ipv4.neigh.default.gc_thresh1 = 2048
net.ipv4.neigh.default.gc_thresh2 = 4096
net.ipv4.neigh.default.gc_thresh3 = 8192
net.ipv6.neigh.default.gc_thresh1 = 2048
net.ipv6.neigh.default.gc_thresh2 = 4096
net.ipv6.neigh.default.gc_thresh3 = 8192

# =============================================================================
# IPv6 Optimizations
# =============================================================================
net.ipv6.conf.all.accept_ra = 2
net.ipv6.conf.default.accept_ra = 2

# =============================================================================
# Memory and System Optimizations
# =============================================================================
vm.swappiness = 10
vm.dirty_ratio = 60
vm.dirty_background_ratio = 2
vm.vfs_cache_pressure = 50

# Kernel panic behavior
kernel.panic = 10
kernel.panic_on_oops = 1

# File descriptor limits
fs.file-max = 2097152

# =============================================================================
# USB and Device Optimizations - For 5G Modems
# =============================================================================
# Increase USB buffer sizes for high-speed 5G modems
# Note: These may need to be set via module parameters in some cases
