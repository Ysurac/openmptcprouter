# OpenMPTCProuter - MPTCP and 5G Modem Optimizations
# Optimized for high-throughput WAN bonding with 5G modems

# =============================================================================
# MPTCP Configuration - Enhanced for Multi-WAN Bonding
# =============================================================================
net.mptcp.enabled = 1
# Use BBR2 for better performance with MPTCP (matches VPS configuration)
net.ipv4.tcp_congestion_control = bbr2

# FIX 1.3: Enable BLEST scheduler for intelligent bandwidth-delay optimization
# BLEST prevents slow paths from blocking fast paths (better than default RTT-only)
# Available schedulers: default, roundrobin, redundant, blest
# BLEST calculates opportunity cost and avoids underutilizing fast links
net.mptcp.mptcp_scheduler = blest
net.mptcp.mptcp_path_manager = fullmesh
net.mptcp.mptcp_checksum = 0
net.mptcp.mptcp_syn_retries = 3

# =============================================================================
# Network Buffer Optimizations - Balanced for Multi-WAN
# =============================================================================
# Buffer sizes balanced for throughput without causing bufferbloat
# Reduced from 128MB to 32MB to prevent latency spikes
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# TCP buffer sizes (min, default, max) - balanced for multi-WAN
# Min: 4KB, Default: 87KB, Max: 32MB
net.ipv4.tcp_rmem = 4096 87380 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432

# Increase network device backlog for high packet rates
net.core.netdev_max_backlog = 300000
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000

# =============================================================================
# TCP Performance Optimizations for WAN Bonding
# =============================================================================
# Enable TCP window scaling (critical for high-latency 5G links)
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_adv_win_scale = 1
net.ipv4.tcp_moderate_rcvbuf = 1

# Disable slow start after idle for better throughput
net.ipv4.tcp_slow_start_after_idle = 0

# TCP Fast Open for reduced latency
net.ipv4.tcp_fastopen = 3

# Enable TCP SACK and FACK for better loss recovery
net.ipv4.tcp_sack = 1
net.ipv4.tcp_dsack = 1

# MTU probing for path MTU discovery (important for 5G modems)
net.ipv4.tcp_mtu_probing = 1

# MSS clamping for tunnel overhead
# Standard: Ethernet MTU 1500 - IP(20) - TCP(20) = 1460
# With VPN tunnel: 1500 - OuterIP(20) - UDP(8) - InnerIP(20) - TCP(20) = 1432
# Conservative value for multiple tunnel layers and MPTCP overhead
net.ipv4.tcp_base_mss = 1400

# Optimize TCP retransmission
net.ipv4.tcp_frto = 2
net.ipv4.tcp_early_retrans = 3

# FIX 1.2: Faster failover for MPTCP - reduced from defaults (3/15)
# Multi-path systems should fail fast and switch paths quickly
net.ipv4.tcp_retries1 = 3
net.ipv4.tcp_retries2 = 8
net.ipv4.tcp_orphan_retries = 0

# Connection reuse and timeouts
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 10
net.ipv4.tcp_max_tw_buckets = 2000000

# TCP keepalive optimizations - AGGRESSIVE for WAN bonding failover
# FIX 1.1: Reduced from 300/5/15 (6.25min total) to 20/3/10 (50s total)
# Fast failover detection critical for multi-WAN bonding
net.ipv4.tcp_keepalive_time = 20
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.tcp_keepalive_intvl = 10

# SYN backlog for high connection rates
net.ipv4.tcp_max_syn_backlog = 16384
net.core.somaxconn = 8192

# Disable TCP metrics cache (better for dynamic multi-WAN)
net.ipv4.tcp_no_metrics_save = 1

# TCP timestamps and protection
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_rfc1337 = 1

# ECN configuration (disabled for compatibility with some ISPs)
net.ipv4.tcp_ecn = 0

# =============================================================================
# Multipath Routing Enhancements
# =============================================================================
# Layer 4 hash policy for better load balancing
net.ipv4.fib_multipath_hash_policy = 1
net.ipv4.fib_multipath_use_neigh = 1

# IPv6 multipath routing (same policy as IPv4)
net.ipv6.fib_multipath_hash_policy = 1

# =============================================================================
# Connection Tracking - Critical for Multi-WAN
# =============================================================================
net.netfilter.nf_conntrack_max = 524288
net.nf_conntrack_max = 524288
net.netfilter.nf_conntrack_tcp_timeout_established = 432000
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 15
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
net.netfilter.nf_conntrack_udp_timeout = 60
net.netfilter.nf_conntrack_udp_timeout_stream = 120

# Enable connection tracking helpers for specific protocols
net.netfilter.nf_conntrack_helper = 1

# =============================================================================
# Queue Discipline - Default to FQ for BBR
# =============================================================================
net.core.default_qdisc = fq

# =============================================================================
# UDP Optimizations - Important for QUIC and VoIP over 5G
# =============================================================================
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# =============================================================================
# IP Forwarding and Routing
# =============================================================================
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Disable source route and redirects for security
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0

# =============================================================================
# RP Filter Configuration - CRITICAL for Multi-WAN
# =============================================================================
# RP filter - Use loose mode (2) for multi-WAN
#
# IMPORTANT SECURITY TRADE-OFF:
# - Strict mode (1): Drops packets arriving on "wrong" interface (best security)
# - Loose mode (2):  Allows packets from any interface if route exists (required for MPTCP)
#
# WHY LOOSE MODE IS REQUIRED:
# Multi-WAN bonding creates asymmetric routing where packets may arrive on a
# different interface than the one used for the outgoing connection. Strict
# RP filter would drop these valid MPTCP packets, breaking WAN bonding.
#
# SECURITY IMPLICATIONS:
# - Loose mode weakens protection against IP spoofing attacks
# - Attackers could potentially send packets with spoofed source addresses
# - Mitigated by: firewall rules, connection tracking, and application-layer validation
#
# DO NOT change to strict mode (1) unless you disable multi-WAN bonding entirely.
#
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.rp_filter = 2

# =============================================================================
# ARP and Neighbor Cache - Optimized for Multiple Interfaces
# =============================================================================
net.ipv4.neigh.default.gc_thresh1 = 2048
net.ipv4.neigh.default.gc_thresh2 = 4096
net.ipv4.neigh.default.gc_thresh3 = 8192
net.ipv6.neigh.default.gc_thresh1 = 2048
net.ipv6.neigh.default.gc_thresh2 = 4096
net.ipv6.neigh.default.gc_thresh3 = 8192

# =============================================================================
# IPv6 Optimizations
# =============================================================================
net.ipv6.conf.all.accept_ra = 2
net.ipv6.conf.default.accept_ra = 2

# =============================================================================
# Memory and System Optimizations
# =============================================================================
vm.swappiness = 10
vm.dirty_ratio = 60
vm.dirty_background_ratio = 2
vm.vfs_cache_pressure = 50

# Kernel panic behavior
kernel.panic = 10
kernel.panic_on_oops = 1

# File descriptor limits
fs.file-max = 2097152

# =============================================================================
# USB and Device Optimizations - For 5G Modems
# =============================================================================
# Increase USB buffer sizes for high-speed 5G modems
# Note: These may need to be set via module parameters in some cases
