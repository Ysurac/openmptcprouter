# OpenMPTCProuter Optimized - Default Configuration
# Override by setting environment variables before running scripts
#
# Example:
#   export OMR_SHADOWSOCKS_PORT=8388
#   ./wizard.sh
#

# ═══════════════════════════════════════════════════════════
# VPS PORT CONFIGURATION
# ═══════════════════════════════════════════════════════════

# Shadowsocks server port
# Default: 65500
OMR_SHADOWSOCKS_PORT=${OMR_SHADOWSOCKS_PORT:-65500}

# Glorytun TCP tunnel port
# Default: 65510
OMR_GLORYTUN_TCP_PORT=${OMR_GLORYTUN_TCP_PORT:-65510}

# Glorytun UDP tunnel port
# Default: 65520
OMR_GLORYTUN_UDP_PORT=${OMR_GLORYTUN_UDP_PORT:-65520}

# Web UI access port
# Default: 8080
OMR_WEB_UI_PORT=${OMR_WEB_UI_PORT:-8080}

# Auto-pairing API port
# Default: 9999
# WARNING: This API should be secured with authentication
OMR_PAIRING_PORT=${OMR_PAIRING_PORT:-9999}

# ═══════════════════════════════════════════════════════════
# ROUTER NETWORK CONFIGURATION
# ═══════════════════════════════════════════════════════════

# LAN IP address (must be static, never DHCP)
# Default: 192.168.2.1
# CRITICAL: Changing this may make router inaccessible
OMR_LAN_IP=${OMR_LAN_IP:-192.168.2.1}

# LAN netmask
# Default: 255.255.255.0 (Class C)
OMR_LAN_NETMASK=${OMR_LAN_NETMASK:-255.255.255.0}

# DHCP server starting IP (offset from LAN IP)
# Default: 100 (results in 192.168.2.100 with default LAN IP)
OMR_DHCP_START=${OMR_DHCP_START:-100}

# DHCP server IP range limit
# Default: 150 (allows 150 DHCP clients)
OMR_DHCP_LIMIT=${OMR_DHCP_LIMIT:-150}

# ═══════════════════════════════════════════════════════════
# ENCRYPTION & SECURITY
# ═══════════════════════════════════════════════════════════

# Shadowsocks encryption method
# Default: chacha20-ietf-poly1305
# Options: chacha20-ietf-poly1305, aes-256-gcm, aes-128-gcm
OMR_SS_METHOD=${OMR_SS_METHOD:-chacha20-ietf-poly1305}

# Credential storage permissions
# Default: 600 (owner read/write only)
OMR_CREDENTIAL_PERMISSIONS=${OMR_CREDENTIAL_PERMISSIONS:-600}

# ═══════════════════════════════════════════════════════════
# NETWORK & CONNECTIVITY
# ═══════════════════════════════════════════════════════════

# External IP detection services (space-separated)
# Used to auto-detect VPS public IP
OMR_IP_DETECT_SERVICES=${OMR_IP_DETECT_SERVICES:-"https://ifconfig.me https://icanhazip.com https://ipinfo.io/ip https://api.ipify.org https://checkip.amazonaws.com"}

# Connection timeout for IP detection (seconds)
OMR_IP_DETECT_TIMEOUT=${OMR_IP_DETECT_TIMEOUT:-5}

# MPTCP path manager
# Default: fullmesh
# Options: fullmesh, ndiffports, binder
OMR_MPTCP_PATH_MANAGER=${OMR_MPTCP_PATH_MANAGER:-fullmesh}

# MPTCP scheduler
# Default: default
# Options: default, roundrobin, redundant
OMR_MPTCP_SCHEDULER=${OMR_MPTCP_SCHEDULER:-default}

# ═══════════════════════════════════════════════════════════
# WIFI DEFAULTS (Router Only)
# ═══════════════════════════════════════════════════════════

# WiFi country code (regulatory domain)
# Default: US
# IMPORTANT: Set to your country code (US, GB, FR, DE, etc.)
OMR_WIFI_COUNTRY=${OMR_WIFI_COUNTRY:-US}

# WiFi SSID prefix for 2.4GHz
# Default: OMR-2G
OMR_WIFI_SSID_2G=${OMR_WIFI_SSID_2G:-OMR-2G}

# WiFi SSID prefix for 5GHz
# Default: OMR-5G
OMR_WIFI_SSID_5G=${OMR_WIFI_SSID_5G:-OMR-5G}

# WiFi encryption
# Default: psk2 (WPA2-PSK)
# Options: psk2, psk-mixed, psk, sae, sae-mixed
OMR_WIFI_ENCRYPTION=${OMR_WIFI_ENCRYPTION:-psk2}

# ═══════════════════════════════════════════════════════════
# SYSTEM PATHS
# ═══════════════════════════════════════════════════════════

# Configuration directory
OMR_CONFIG_DIR=${OMR_CONFIG_DIR:-/etc/openmptcprouter}

# Credentials file
OMR_CREDENTIALS_FILE=${OMR_CREDENTIALS_FILE:-/root/openmptcprouter_credentials.txt}

# Web UI directory
OMR_WEB_DIR=${OMR_WEB_DIR:-/var/www/omr-setup}

# Log file
OMR_LOG_FILE=${OMR_LOG_FILE:-/var/log/openmptcprouter.log}

# ═══════════════════════════════════════════════════════════
# ADVANCED OPTIONS
# ═══════════════════════════════════════════════════════════

# Enable debug output
# Default: 0 (disabled)
# Set to 1 to enable verbose debugging
OMR_DEBUG=${OMR_DEBUG:-0}

# Service restart timeout (seconds)
# Default: 30
OMR_SERVICE_TIMEOUT=${OMR_SERVICE_TIMEOUT:-30}

# UCI commit timeout (seconds)
# Default: 10
OMR_UCI_TIMEOUT=${OMR_UCI_TIMEOUT:-10}

# Enable automatic backups before configuration changes
# Default: 1 (enabled)
OMR_AUTO_BACKUP=${OMR_AUTO_BACKUP:-1}

# Backup retention (number of backups to keep)
# Default: 5
OMR_BACKUP_RETENTION=${OMR_BACKUP_RETENTION:-5}

# ═══════════════════════════════════════════════════════════
# DO NOT EDIT BELOW THIS LINE
# (Automatic environment export)
# ═══════════════════════════════════════════════════════════

export OMR_SHADOWSOCKS_PORT
export OMR_GLORYTUN_TCP_PORT
export OMR_GLORYTUN_UDP_PORT
export OMR_WEB_UI_PORT
export OMR_PAIRING_PORT
export OMR_LAN_IP
export OMR_LAN_NETMASK
export OMR_DHCP_START
export OMR_DHCP_LIMIT
export OMR_SS_METHOD
export OMR_CREDENTIAL_PERMISSIONS
export OMR_IP_DETECT_SERVICES
export OMR_IP_DETECT_TIMEOUT
export OMR_MPTCP_PATH_MANAGER
export OMR_MPTCP_SCHEDULER
export OMR_WIFI_COUNTRY
export OMR_WIFI_SSID_2G
export OMR_WIFI_SSID_5G
export OMR_WIFI_ENCRYPTION
export OMR_CONFIG_DIR
export OMR_CREDENTIALS_FILE
export OMR_WEB_DIR
export OMR_LOG_FILE
export OMR_DEBUG
export OMR_SERVICE_TIMEOUT
export OMR_UCI_TIMEOUT
export OMR_AUTO_BACKUP
export OMR_BACKUP_RETENTION
