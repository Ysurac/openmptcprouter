# Function to get APN configuration for a carrier
get_carrier_apn() {
	local carrier="$1"
	local carrier_lower=$(echo "$carrier" | tr '[:upper:]' '[:lower:]' | tr ' ' '_')

	# Check if carrier exists
	if [ -n "${USA_CARRIER_APNS[$carrier_lower]}" ]; then
		echo "${USA_CARRIER_APNS[$carrier_lower]}"
		return 0
	fi

	# Try to match partial names
	for key in "${!USA_CARRIER_APNS[@]}"; do
		if echo "$key" | grep -qi "$carrier_lower"; then
			echo "${USA_CARRIER_APNS[$key]}"
			return 0
		fi
	done

	return 1
}

# Function to list all available carriers
list_carriers() {
	echo "Available USA carriers:"
	for carrier in "${!USA_CARRIER_APNS[@]}"; do
		echo "  - $carrier"
	done | sort
}

# Function to parse APN data
parse_apn_data() {
	local apn_data="$1"
	IFS=':' read -r apn username password auth_type <<< "$apn_data"

	export APN_NAME="$apn"
	export APN_USERNAME="$username"
	export APN_PASSWORD="$password"
	export APN_AUTH_TYPE="${auth_type:-PAP}"
}
